services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: pactplum
      POSTGRES_PASSWORD: pactplum
      POSTGRES_DB: pactplum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactplum"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: {}
